---
# Ansible tasks for setting up Docker Nginx Proxy environment
# Requires 'become: true'

- name: Install system dependencies
  ansible.builtin.apt:
    name:
      - git
      - moreutils
      - openssl
      - python3-openssl
    state: present

- name: Ensure repository directory inherits docker group permissions
  ansible.builtin.file:
    path: "{{ docker_nginx_proxy_dir }}"
    state: directory
    owner: "{{ docker_nginx_proxy_dir_owner }}"
    group: "{{ docker_nginx_proxy_dir_group }}"
    mode: "{{ docker_nginx_proxy_dir_mode }}"

- name: Check git for updates on docker-compose-nginx-proxy
  ansible.builtin.git:
    repo: "{{ docker_nginx_proxy_repo }}"
    dest: "{{ docker_nginx_proxy_dir }}"
    force: "{{ docker_nginx_proxy_force | default(false) }}"
    version: "{{ docker_nginx_proxy_version | default('main') }}"
    remote: "{{ docker_nginx_proxy_remote | default('origin') }}"
    accept_newhostkey: "{{ docker_nginx_proxy_accept_newhostkey | default(true) }}"
  become_user: "{{ docker_nginx_proxy_become_user | default('root') }}"

- name: Create directory for test certificates
  ansible.builtin.file:
    path: "{{ docker_nginx_proxy_dir }}/ssl/test"
    state: directory
    owner: "{{ docker_nginx_proxy_dir_owner }}"
    group: "{{ docker_nginx_proxy_dir_group }}"
    mode: "{{ docker_nginx_proxy_dir_mode }}"

- name: Generate test private key
  community.crypto.openssl_privatekey:
    path: "{{ docker_nginx_proxy_dir }}/ssl/test/selfsigned.key"

# Generate an OpenSSL Certificate Signing Request
- name: Generate test certificate signing request
  community.crypto.openssl_csr:
    path: "{{ docker_nginx_proxy_dir }}/ssl/test/selfsigned.csr"
    privatekey_path: "{{ docker_nginx_proxy_dir }}/ssl/test/selfsigned.key"
    common_name: localhost

- name: Generate a self-signed OpenSSL certificate
  community.crypto.x509_certificate:
    path: "{{ docker_nginx_proxy_dir }}/ssl/test/selfsigned.crt"
    privatekey_path: "{{ docker_nginx_proxy_dir }}/ssl/test/selfsigned.key"
    csr_path: "{{ docker_nginx_proxy_dir }}/ssl/test/selfsigned.csr"
    provider: selfsigned
    state: present

- name: Generate Diffie-Hellman
  community.crypto.openssl_dhparam:
    path: "{{ docker_nginx_proxy_dir }}/ssl/dhparams4096.pem"
    size: 4096
    force: false

- name: Creates an entry like "PATH=/opt/bin" on top of crontab
  ansible.builtin.cron:
    name: PATH
    env: true
    job: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

- name: Create cron to renew certificates every SAT
  ansible.builtin.cron:
    name: "Certbot"
    minute: "{{ docker_nginx_proxy_certbot_cron_minute | default((range(0, 60) | random(seed=inventory_hostname ~ '-minute'))) }}"
    hour: "{{ docker_nginx_proxy_certbot_cron_hour | default((range(0, 6) | random(seed=inventory_hostname ~ '-hour'))) }}"
    job: "cd {{ docker_nginx_proxy_dir }} && chronic docker compose run --rm --use-aliases certbot renew && chronic docker exec nginx-proxy nginx -s reload"

- name: Create network
  community.docker.docker_network:
    name: www-network
  when: docker_nginx_proxy_create_network

- name: Create and start services
  community.docker.docker_compose_v2:
    project_src: "{{ docker_nginx_proxy_dir }}"
    pull: always
    state: present
  when: docker_nginx_proxy_start_compose
